services:
  kodus-service-billing:
    image: kodus-service-billing:latest
    container_name: kodus-service-billing
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    ports:
      - "3992:3992"
    environment:
      - ENV=homolog
      # Pending migrations run on boot (docker/prod-entrypoint.sh).
      # Override per host if a deploy must skip them.
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    env_file:
      - .env.qa
    restart: unless-stopped

volumes:
  log_volume:
